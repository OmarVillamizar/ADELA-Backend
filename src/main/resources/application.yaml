jwt:
    secret: ${JWT_SECRET_KEY}
spring:
    datasource:
        url: ${DATABASE_URL}
        username: ${DATABASE_USERNAME}
        password: ${DATABASE_PASSWORD}
        driver-class-name: ${DATABASE_DRIVER_NAME}
    jpa:
        hibernate:
            # Flyway es la fuente de verdad del esquema. Hibernate solo comprueba que
            # las entidades cuadren con lo que las migraciones dejaron; ya no altera
            # nada por su cuenta, que es como el esquema derivaba en silencio.
            ddl-auto: validate
        properties: 
            hibernate:
                dialect: ${HIBERNATE_DIALECT}
        # Sin esto la sesion de Hibernate sigue abierta durante el render de la
        # respuesta: retiene la conexion del pool mucho despues de que el servicio
        # haya terminado, y oculta las relaciones LAZY que se cargan por accidente
        # al serializar. Se apaga despues de marcar las lecturas @Transactional y
        # de que los endpoints devuelvan DTO en lugar de entidades.
        open-in-view: false
    flyway:
        enabled: true
        # El esquema ya existe, creado por ddl-auto: update. baseline lo adopta como
        # version 1 en lugar de intentar recrearlo desde cero.
        baseline-on-migrate: true
        baseline-version: 1
    servlet:
        multipart:
            # Solo lo usa la subida del PDF de Nelse (la importacion de JSON no es multipart),
            # asi que el tope es el mismo adela.ia.max-mb: Tomcat corta antes de leer todo el
            # archivo a memoria. max-request-size no puede ser "max-mb + algo" (los
            # placeholders no suman): queda igual, y ExtractorDocumento vuelve a comprobar el
            # tamano con un mensaje claro. Cubre el campo de instrucciones salvo que el PDF
            # pese justo el maximo.
            max-file-size: ${IA_MAX_MB:15}MB
            max-request-size: ${IA_MAX_MB:15}MB
    application:
        name: adela
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope: profile, email
                provider:
                    google:
                        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
                        token-uri: https://www.googleapis.com/oauth2/v4/token
                        user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
                        user-name-attribute: sub
            resourceserver:
                jwt:
                      issuer-uri: https://accounts.google.com
                      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
cors:
  allowed-origins: ${ALLOWED_ORIGINS}
# Documentación desactivada por defecto: publica el mapa completo de la API.
# Poner SWAGGER_ENABLED=true solo en entornos de desarrollo.
springdoc:
    api-docs:
        enabled: ${SWAGGER_ENABLED:false}
        path: /api-docs
    swagger-ui:
        enabled: ${SWAGGER_ENABLED:false}
        path: /docs/swagger-ui.html

# Endpoint /api/dev para poblar grupos con estudiantes simulados. Solo en local:
# crea usuarios ficticios en la base de datos.
adela:
    dev:
        simulacion: ${DEV_SIMULACION:false}
    ia:
        # El catálogo (fichas.md y los JSON de los instrumentos) tiene licencia de
        # terceros y no va en el repositorio. Si falta en el classpath (ia/catalogo/),
        # se busca en este directorio; sin él Nelse no reconoce instrumentos.
        catalogo-dir: ${IA_CATALOGO_DIR:}
        # Nelse (generación con el modelo) queda apagada por defecto: sin llave o con
        # habilitada=false solo funciona la importación de JSON ("Con tu propia IA"),
        # que no llama a ningún proveedor. La llave va solo en AI_API, nunca en este archivo.
        habilitada: ${IA_HABILITADA:false}
        base-url: ${IA_BASE_URL:https://api.deepseek.com}
        modelo: ${IA_MODELO:deepseek-flash}
        api-key: ${AI_API:}
        # Tope de toda la petición, no solo de la conexión: un PDF largo con razonamiento alto tarda.
        timeout: ${IA_TIMEOUT:180s}
        esfuerzo-generar: ${IA_ESFUERZO_GENERAR:high}
        # Igual al de generar a propósito: la caché del proveedor depende también del esfuerzo, y
        # corregir con otro (p. ej. low tras high) paga de nuevo todo el prefijo (sistema, documento
        # e imágenes), ~$0,007 más por ronda. Se puede bajar con IA_ESFUERZO_CORREGIR si se acepta eso.
        esfuerzo-corregir: ${IA_ESFUERZO_CORREGIR:high}
        max-salida: ${IA_MAX_SALIDA:32000}
        cuota-diaria: ${IA_CUOTA_DIARIA:30}
        max-mb: ${IA_MAX_MB:15}
        max-paginas: ${IA_MAX_PAGINAS:40}
        max-imagenes: ${IA_MAX_IMAGENES:12}

server:
  port: ${PORT:8080}
  # LimiteTasaFilter limita por IP. Detrás de un proxy (balanceador, Render,
  # nginx) todas las peticiones llegan desde la IP del proxy y el límite se
  # vuelve global: ahí poner FORWARD_HEADERS_STRATEGY=native para leer la IP
  # real de X-Forwarded-For. Sin proxy dejar none, o cualquiera falsifica su IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
